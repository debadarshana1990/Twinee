name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app, DMG and ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="0.0.0-dev"; fi
          VERSION="$VERSION" bash build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Twinee
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "Twinee ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
